[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alio-olio"
version = "0.1.0"
description = "ALIO recruitment alerts synchronized to Notion and Telegram"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.10,<4",
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "pypdf>=5,<7",
  "pdfplumber>=0.11,<1",
  "olefile>=0.47,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
# macOS 전용. 스캔 PDF·캡처 이미지 공고문을 OCR로 읽는다.
# 리눅스(도커)에서는 설치하지 않아도 되고, 그때는 이미지 첨부가 "미정"으로 남는다.
ocr = ["pyobjc-framework-Vision>=10; sys_platform == 'darwin'"]

[project.scripts]
alio-olio = "alio_olio.cli:main"

[tool.setuptools.packages.find]
include = ["alio_olio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
